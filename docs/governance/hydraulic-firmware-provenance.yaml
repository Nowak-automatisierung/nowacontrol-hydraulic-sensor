    requirement: "Pass HIL and RF gates without deriving product defaults from a test site."
  - id: delivery_safety
    requirement: "Pass bootloader, signing, OTA, rollback, and Home Assistant contract gates."
  - id: independent_release_review
    requirement: "Approve repository transfer and release separately after all prior gates pass."
