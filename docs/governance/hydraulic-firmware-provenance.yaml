    requirement: "Produce SBOM, firmware hash, map file, and build log."
  - id: semantic_compatibility
    requirement: "Resolve and verify every documented ZCL, clock, RF, and security invariant."
  - id: device_inventory
    requirement: "Establish the installed device population before deployment planning."
